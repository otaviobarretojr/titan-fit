apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-parcelize'

import groovy.json.JsonSlurper

def titanKeystorePath = System.getenv('TITAN_ANDROID_KEYSTORE_PATH')
def titanKeystorePassword = System.getenv('TITAN_ANDROID_KEYSTORE_PASSWORD')
def titanPackageJson = new JsonSlurper().parse(file('../../package.json'))
def titanVersionName = titanPackageJson.version as String
def titanVersionParts = titanVersionName.tokenize('.').collect { it as Integer }
def titanVersionCode = (titanVersionParts[0] * 1000000) + (titanVersionParts[1] * 1000) + titanVersionParts[2]

android {
    signingConfigs { titanRelease { if (titanKeystorePath && titanKeystorePassword) { storeFile file(titanKeystorePath); storePassword titanKeystorePassword; keyAlias 'titanfit'; keyPassword titanKeystorePassword } } }
    namespace = "com.otaviobarretojr.titanfit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig { applicationId "com.otaviobarretojr.titanfit"; minSdkVersion 29; targetSdkVersion rootProject.ext.targetSdkVersion; versionCode titanVersionCode; versionName titanVersionName; testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"; aaptOptions { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' } }
    buildTypes {
        debug {
            applicationIdSuffix ".recovery"
            versionNameSuffix "-recovery"
        }
        release { minifyEnabled false; signingConfig signingConfigs.titanRelease; proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' }
    }
}
repositories { flatDir{ dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation files('libs/samsung-health-data-api-1.1.0.aar')
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}
apply from: 'capacitor.build.gradle'
try { def servicesJSON = file('google-services.json'); if (servicesJSON.text) { apply plugin: 'com.google.gms.google-services' } } catch(Exception e) { logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work") }
