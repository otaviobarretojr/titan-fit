name: Validate v0.60.2 programming flow
on:
  push:
    paths:
      - '.github/workflows/v0602-validation-marker.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate
      - name: Write success marker
        run: |
          printf 'v0.60.2 validated\n' > docs/v0.60.2-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.60.2-validation.txt
          git commit -m "chore: mark v0.60.2 validated"
          git push
