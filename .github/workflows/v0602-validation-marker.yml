name: Validate v0.60.2 programming flow
on:
  push:
    paths:
      - '.github/workflows/v0602-validation-marker.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate with concise result
        run: |
          set +e
          STATUS=0
          FAIL_CMD=""
          : > /tmp/v0602.log
          : > /tmp/v0602.status
          for CMD in "npm ci" "npm run lint" "npm run typecheck" "npm run test" "npm run build" "npm run validate"; do
            echo "===== $CMD =====" >> /tmp/v0602.log
            bash -lc "$CMD" >> /tmp/v0602.log 2>&1
            CODE=$?
            echo "$CMD=$CODE" >> /tmp/v0602.status
            if [ $CODE -ne 0 ]; then STATUS=$CODE; FAIL_CMD="$CMD"; break; fi
          done
          {
            echo "status=$STATUS"
            echo "fail_cmd=$FAIL_CMD"
            cat /tmp/v0602.status
            echo "--- tail ---"
            tail -80 /tmp/v0602.log
          } > docs/v0.60.2-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.60.2-validation.txt
          git commit -m "chore: record v0.60.2 validation result" || true
          git push
          exit 0
# final rerun after Programming compatibility fix
