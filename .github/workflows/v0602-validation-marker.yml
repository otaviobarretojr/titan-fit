name: Validate v0.60.2 programming flow
on:
  push:
    paths:
      - '.github/workflows/v0602-validation-marker.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run validation and capture result
        run: |
          set +e
          : > /tmp/v0602.log
          STATUS=0
          for CMD in "npm ci" "npm run lint" "npm run typecheck" "npm run test" "npm run build" "npm run validate"; do
            echo "===== $CMD =====" | tee -a /tmp/v0602.log
            bash -lc "$CMD" >> /tmp/v0602.log 2>&1
            CODE=$?
            echo "exit=$CODE" | tee -a /tmp/v0602.log
            if [ $CODE -ne 0 ]; then STATUS=$CODE; break; fi
          done
          {
            echo "status=$STATUS"
            echo "--- tail ---"
            tail -120 /tmp/v0602.log
          } > docs/v0.60.2-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.60.2-validation.txt
          git commit -m "chore: record v0.60.2 validation result"
          git push
          exit 0
# rerun after timer test stabilization
