name: Apply workout skip patch

on:
  push:
    paths:
      - scripts/apply-workout-skip.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply workout skip patch
        run: node scripts/apply-workout-skip.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx src/features/workout/types.ts src/styles/workout-mode-v038.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: allow skipping workout exercises"
          git push origin HEAD:main
