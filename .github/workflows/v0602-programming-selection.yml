name: "Apply TITAN FIT v0.60.2 programming selection"
on:
  push:
    paths:
      - '.github/workflows/v0602-programming-selection.yml'
      - 'scripts/apply-v0602-programming-selection.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v0.60.2
        run: node scripts/apply-v0602-programming-selection.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.60.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json package-lock.json CHANGELOG.md
          git commit -m "feat: manual PPL programming selection v0.60.2"
          git push
