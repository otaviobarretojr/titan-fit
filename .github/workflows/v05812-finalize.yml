name: "Finalize TITAN FIT v0.58.12 Bottom Navigation"

on:
  push:
    paths:
      - '.github/workflows/v05812-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bump version and changelog
        run: |
          npm version 0.58.12 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          marker='Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          entry='''\n## v0.58.12 — Menu inferior realinhado\n- Menu inferior recebe uma única camada final de estilos para evitar conflito entre regras antigas.\n- Ícones aumentados e centralizados, com distribuição uniforme entre as quatro abas.\n- Espaçamento entre ícone e legenda reduzido e alinhamento vertical padronizado.\n- Área de toque e altura do menu ajustadas para ergonomia no Android e safe-area inferior.\n- Estado ativo mantém destaque discreto no padrão visual One UI.\n'''
          if '## v0.58.12 — Menu inferior realinhado' not in s:
              s=s.replace(marker, marker+entry, 1)
          p.write_text(s)
          PY
      - name: Validate release candidate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run validate
      - name: Commit v0.58.12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: v0.58.12 bottom navigation alignment"
          git push
