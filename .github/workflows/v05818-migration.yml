name: "Apply TITAN FIT v0.58.18 training export"
on:
  push:
    paths:
      - '.github/workflows/v05818-migration.yml'
      - 'scripts/apply-v05818.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v0.58.18
        run: node scripts/apply-v05818.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.58.18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/programming/ProgrammingPage.tsx src/features/programming/TrainingPlanExport.tsx src/styles/programming-export-v05818.css src/main.tsx tests/training-plan-export.test.ts package.json package-lock.json CHANGELOG.md
          git commit -m "feat: export active training plan v0.58.18"
          git push
