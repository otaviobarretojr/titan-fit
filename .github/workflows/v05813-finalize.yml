name: "Finalize TITAN FIT v0.58.13 Navigation Proportion"

on:
  push:
    paths:
      - '.github/workflows/v05813-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bump version and changelog
        run: |
          npm version 0.58.13 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = 'Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section = '''\n## v0.58.13 — Menu inferior proporcional\n- Barra inferior reconstruída com quatro zonas exatamente iguais de 25% da largura da tela.\n- Removido o posicionamento por `left: 50%` e `transform`, eliminando deslocamento lateral percebido no Android.\n- Ícones aumentados para 30 px, com cápsula ativa maior e centralização rígida.\n- Altura, rótulos e espaçamento vertical reajustados para melhor proporção e padrão visual mobile.\n- Nova camada final de navegação bloqueia interferência de estilos legados.\n'''
          if '## v0.58.13 — Menu inferior proporcional' not in text:
              text = text.replace(marker, marker + section)
          path.write_text(text)
          PY
      - name: Validate release candidate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.58.13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v0.58.13"
          git push
