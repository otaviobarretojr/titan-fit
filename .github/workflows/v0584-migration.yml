name: Apply TITAN FIT v0.58.4 workout audit

on:
  push:
    paths:
      - '.github/workflows/v0584-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply workout UX corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/workout/WorkoutExecutionView.tsx')
          text = path.read_text()
          text = text.replace('>Pular exercício · sem tempo</button>', '>Pular exercício</button>')
          old = "{set.completed ? '✓ Registro concluído' : exerciseType === 'strength' ? 'Registrar série' : `Concluir ${typeLabel(exerciseType).toLowerCase()}`}"
          new = "{set.completed ? '✓ Registro concluído' : exerciseType === 'strength' ? 'Registrar série' : exerciseType === 'cardio' ? 'Registrar cardio' : `Concluir ${typeLabel(exerciseType).toLowerCase()}`}"
          if old not in text:
              raise SystemExit('Workout action expression not found')
          text = text.replace(old, new)
          path.write_text(text)

          test = Path('tests/WorkoutExecutionView.test.tsx')
          content = test.read_text().replace("name: 'Pular exercício · sem tempo'", "name: 'Pular exercício'")
          marker = "  it('troca para uma alternativa oficial e exibe o vídeo próprio dela', () => {"
          cardio_test = '''  it('trata cardio como etapa do treino e usa a ação Registrar cardio', () => {\n    const cardioWorkout: TitanWorkoutDay = {\n      id: 'mixed', day: 'Segunda', title: 'Treino + cardio',\n      exercises: [{ id: 'zone2', name: 'Zona 2', muscleGroup: 'Cardiovascular', exerciseType: 'cardio', sets: 1, durationSeconds: 1800, cardioZone: 'Zona 2' }]\n    };\n    render(<WorkoutExecutionView planId=\"plan-cardio\" planName=\"Plano A\" workout={cardioWorkout} onBack={vi.fn()} onCompleted={vi.fn()} />);\n    expect(screen.getByRole('button', { name: 'Registrar cardio' })).toBeInTheDocument();\n    expect(screen.queryByText('Pular exercício · sem tempo')).not.toBeInTheDocument();\n    expect(screen.getByRole('button', { name: 'Pular exercício' })).toBeInTheDocument();\n  });\n\n'''
          if marker not in content:
              raise SystemExit('Test insertion marker not found')
          content = content.replace(marker, cardio_test + marker)
          test.write_text(content)
          PY

      - name: Bump version and changelog
        run: |
          npm version 0.58.4 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = 'Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section = '''\n## v0.58.4 — Auditoria do modo treino\n- Revisão do fluxo principal de execução de treino após a integração definitiva do cardio ao projeto de musculação.\n- Correção da ação de pulo para exibir somente “Pular exercício”.\n- Cardio integrado passa a usar a ação explícita “Registrar cardio” dentro da própria sequência do treino.\n- Teste dedicado garante que o cardio seja tratado como etapa do treino, sem reintroduzir fluxo isolado.\n- Preservação de retomada de sessão, vídeos, alternativas, descanso automático, histórico e progressão.\n'''
          if '## v0.58.4 — Auditoria do modo treino' not in text:
              text = text.replace(marker, marker + section)
          path.write_text(text)
          PY

      - name: Validate locally
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate

      - name: Commit stable v0.58.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "feat: stabilize workout mode v0.58.4"
          git push
