name: Fix workout skip lint

on:
  push:
    paths:
      - scripts/fix-workout-skip-lint.mjs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix lint escapes
        run: node scripts/fix-workout-skip-lint.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: workout skip lint"
          git push origin HEAD:main
