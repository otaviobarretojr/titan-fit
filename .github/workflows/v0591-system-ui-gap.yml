name: "TITAN FIT v0.59.1 Android system UI spacing"
on:
  push:
    paths:
      - '.github/workflows/v0591-system-ui-gap.yml'
      - 'src/styles/rework-foundation-v059.css'
permissions:
  contents: write
jobs:
  validate-and-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Version v0.59.1
        run: |
          npm version 0.59.1 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          text=p.read_text()
          marker='Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section='''\n## v0.59.1 — Espaçamento da navegação Android\n- Menu inferior passa a manter uma folga visual adicional da barra de gestos/botões do Android.\n- Conteúdo recebe padding inferior correspondente para não ficar escondido atrás da navegação.\n- Área de saída do modo treino foi compactada para liberar espaço útil na tela.\n- Safe-area continua respeitada em aparelhos com gestos, recortes e barras de sistema diferentes.\n'''
          if '## v0.59.1 — Espaçamento da navegação Android' not in text:
              text=text.replace(marker, marker+section)
          p.write_text(text)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.59.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/rework-foundation-v059.css package.json package-lock.json CHANGELOG.md
          git commit -m "fix: separate bottom navigation from Android system UI v0.59.1"
          git push
