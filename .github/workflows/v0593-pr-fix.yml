name: "Apply TITAN FIT v0.59.3 PR fix"
on:
  push:
    paths:
      - '.github/workflows/v0593-pr-fix.yml'
      - 'scripts/apply-v0593-pr-fix.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply PR correction
        run: node scripts/apply-v0593-pr-fix.mjs
      - name: Align PR regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/WorkoutExecutionView.test.tsx')
          s = p.read_text()
          s = s.replace("expect(screen.getByText('80 kg × 10')).toBeInTheDocument();", "expect(screen.getAllByText('80 kg × 10').length).toBeGreaterThanOrEqual(2);")
          s = s.replace("expect(screen.getByText('90 kg × 10')).toBeInTheDocument();", "expect(screen.getAllByText('90 kg × 10').length).toBeGreaterThanOrEqual(2);")
          p.write_text(s)
          PY
      - name: Validate complete project
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.59.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/history/intelligence.ts src/features/workout/WorkoutExecutionView.tsx tests/WorkoutExecutionView.test.tsx tests/pr-engine-v0593.test.ts package.json package-lock.json CHANGELOG.md
          git commit -m "fix: restore persistent PR tracking v0.59.3"
          git push