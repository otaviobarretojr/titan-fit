name: "Finalize TITAN FIT v0.58.9 Coach reports audit"

on:
  push:
    paths:
      - '.github/workflows/v0589-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bump version and changelog
        run: |
          npm version 0.58.9 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = 'Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section = '''\n## v0.58.9 — Coach e relatórios unificados\n- Coach deixa de contar registros antigos exclusivamente cardiovasculares como frequência de musculação.\n- Treinos mistos continuam valendo como uma única sessão de musculação, com o cardio analisado dentro da mesma sessão.\n- Coach passa a exibir leitura cardiovascular integrada com sessões, duração, distância e frequência cardíaca quando disponível.\n- Relatórios passam a mostrar o cardio dentro do card de Treino, sem recriar módulo cardiovascular isolado.\n- Comparações de cardio usam treinos com cardio como unidade de sessão, preservando histórico antigo e evitando duplicidades.\n- Novos testes cobrem treino misto, cardio legado e consistência entre Coach e Relatórios.\n'''
          if '## v0.58.9 — Coach e relatórios unificados' not in text:
              text = text.replace(marker, marker + section)
          path.write_text(text)
          PY
      - name: Validate release candidate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.58.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: prepare v0.58.9"
          git push
