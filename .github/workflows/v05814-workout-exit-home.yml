name: "TITAN FIT v0.58.14 Workout Exit Home"

on:
  push:
    paths:
      - '.github/workflows/v05814-workout-exit-home.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply workout exit correction
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path('src/features/plan/PlanViewer.tsx')
          text = plan.read_text()
          text = text.replace(
            "type Props = { plan: TitanPlan; initialWorkoutId?: string | null; onImportAnother: () => void; onRemove: () => void; onHistoryChange: () => void; onDirectStartHandled?: () => void };",
            "type Props = { plan: TitanPlan; initialWorkoutId?: string | null; onImportAnother: () => void; onRemove: () => void; onHistoryChange: () => void; onExitWorkout?: () => void; onDirectStartHandled?: () => void };"
          )
          text = text.replace(
            "export function PlanViewer({ plan, initialWorkoutId, onImportAnother, onRemove, onHistoryChange, onDirectStartHandled }: Props) {",
            "export function PlanViewer({ plan, initialWorkoutId, onImportAnother, onRemove, onHistoryChange, onExitWorkout, onDirectStartHandled }: Props) {"
          )
          old = "if (executingWorkout) return <WorkoutExecutionView planId={plan.id} planName={plan.name} workout={executingWorkout} onBack={() => { setExecutingWorkoutId(null); onDirectStartHandled?.(); }} onCompleted={() => { setExecutingWorkoutId(null); setSelectedWorkoutId(null); onDirectStartHandled?.(); onHistoryChange(); }} />;"
          new = "if (executingWorkout) return <WorkoutExecutionView planId={plan.id} planName={plan.name} workout={executingWorkout} onBack={() => { setExecutingWorkoutId(null); setSelectedWorkoutId(null); onDirectStartHandled?.(); onExitWorkout?.(); }} onCompleted={() => { setExecutingWorkoutId(null); setSelectedWorkoutId(null); onDirectStartHandled?.(); onHistoryChange(); }} />;"
          if old not in text:
            raise SystemExit('PlanViewer workout callback marker not found')
          plan.write_text(text.replace(old, new))

          app = Path('src/app/App.tsx')
          text = app.read_text()
          old = "onRemove={deletePlan} onHistoryChange={historyChanged} />"
          new = "onRemove={deletePlan} onHistoryChange={historyChanged} onExitWorkout={() => navigate('today', true)} />"
          if old not in text:
            raise SystemExit('App PlanViewer marker not found')
          app.write_text(text.replace(old, new))
          PY

      - name: Add regression test
        run: |
          cat > tests/workout-exit-home.test.tsx <<'EOF'
          import { fireEvent, render, screen } from '@testing-library/react';
          import { describe, expect, it, vi } from 'vitest';
          import { PlanViewer } from '../src/features/plan/PlanViewer';
          import type { TitanPlan } from '../src/features/plan/types';

          const plan = {
            id: 'plan-exit-test',
            name: 'Plano teste',
            workouts: [{
              id: 'workout-test',
              day: 'Segunda',
              title: 'PUSH A',
              focus: 'Peitoral',
              exercises: [{
                id: 'bench',
                name: 'Supino',
                muscleGroup: 'Peitoral',
                exerciseType: 'strength',
                sets: 1,
                minReps: 8,
                maxReps: 10,
                targetRir: 2,
                restSeconds: 60,
              }],
            }],
          } as TitanPlan;

          describe('saída do modo treino', () => {
            it('aciona retorno à Home em vez de exibir Projeto completo', () => {
              const onExitWorkout = vi.fn();
              render(<PlanViewer plan={plan} initialWorkoutId="workout-test" onImportAnother={vi.fn()} onRemove={vi.fn()} onHistoryChange={vi.fn()} onExitWorkout={onExitWorkout} />);
              const exit = screen.queryByRole('button', { name: /sair|voltar/i });
              expect(exit).not.toBeNull();
              fireEvent.click(exit!);
              expect(onExitWorkout).toHaveBeenCalledTimes(1);
            });
          });
          EOF

      - name: Bump version and changelog
        run: |
          npm version 0.58.14 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = 'Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section = '''\n## v0.58.14 — Saída do treino retorna à Home\n- Sair manualmente do modo treino agora retorna diretamente ao Dashboard/Home.\n- A tela intermediária “Projeto completo” deixa de aparecer ao sair de uma sessão em andamento.\n- Sessão não concluída continua preservada para retomada posterior.\n- Conclusão normal do treino mantém atualização de histórico e retorno ao Dashboard.\n'''
          if '## v0.58.14 — Saída do treino retorna à Home' not in text:
              text = text.replace(marker, marker + section)
          path.write_text(text)
          PY

      - name: Validate release candidate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate

      - name: Commit v0.58.14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/features/plan/PlanViewer.tsx tests/workout-exit-home.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "fix: return workout exit to home v0.58.14"
          git push
