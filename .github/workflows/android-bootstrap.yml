name: Bootstrap Android TITAN FIT

on:
  push:
    paths:
      - 'native/android-bootstrap.trigger'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.4.2 @capacitor/android@8.4.2 --save
          npm install @capacitor/cli@8.4.2 --save-dev

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Install Health Connect native bridge
        run: |
          PACKAGE_DIR='android/app/src/main/java/com/otaviobarretojr/titanfit'
          mkdir -p "$PACKAGE_DIR/health"
          rm -f "$PACKAGE_DIR/MainActivity.java"
          cp native/android-health-connect/MainActivity.kt "$PACKAGE_DIR/MainActivity.kt"
          cp native/android-health-connect/PermissionsRationaleActivity.kt "$PACKAGE_DIR/PermissionsRationaleActivity.kt"
          cp native/android-health-connect/TitanHealthConnectPlugin.kt "$PACKAGE_DIR/health/TitanHealthConnectPlugin.kt"

          python3 - <<'PY'
          from pathlib import Path

          app = Path('android/app/build.gradle')
          text = app.read_text()
          if "org.jetbrains.kotlin.android" not in text:
              text = text.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'org.jetbrains.kotlin.android'")
          text = text.replace('minSdkVersion rootProject.ext.minSdkVersion', 'minSdkVersion 26')
          if 'androidx.health.connect:connect-client:1.1.0' not in text:
              text = text.replace('dependencies {', "dependencies {\n    implementation 'androidx.health.connect:connect-client:1.1.0'\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'")
          app.write_text(text)

          root = Path('android/build.gradle')
          text = root.read_text()
          if 'kotlin-gradle-plugin' not in text:
              text = text.replace('dependencies {', "dependencies {\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'", 1)
          root.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = '''\n    <uses-permission android:name="android.permission.health.READ_SLEEP" />\n    <uses-permission android:name="android.permission.health.READ_HEART_RATE" />\n    <uses-permission android:name="android.permission.health.READ_STEPS" />\n    <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />\n    <uses-permission android:name="android.permission.health.READ_EXERCISE" />\n    <uses-permission android:name="android.permission.health.READ_DISTANCE" />\n    <uses-permission android:name="android.permission.health.READ_BODY_FAT" />\n'''
          if 'android.permission.health.READ_SLEEP' not in text:
              text = text.replace('<application', permissions + '\n    <application')

          rationale = '''\n        <activity\n            android:name=".PermissionsRationaleActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />\n            </intent-filter>\n        </activity>\n\n        <activity-alias\n            android:name="ViewPermissionUsageActivity"\n            android:exported="true"\n            android:targetActivity=".PermissionsRationaleActivity"\n            android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />\n                <category android:name="android.intent.category.HEALTH_PERMISSIONS" />\n            </intent-filter>\n        </activity-alias>\n'''
          if 'PermissionsRationaleActivity' not in text:
              text = text.replace('        <provider', rationale + '\n        <provider')

          queries = '''\n    <queries>\n        <package android:name="com.google.android.apps.healthdata" />\n    </queries>\n'''
          if 'com.google.android.apps.healthdata' not in text:
              text = text.replace('</manifest>', queries + '\n</manifest>')
          manifest.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: titan-fit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit generated Android project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Android project already synchronized.'
          else
            git commit -m 'android: generate Capacitor project'
            git push
          fi
