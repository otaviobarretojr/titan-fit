name: "Apply TITAN FIT v0.60.1 workout timer"
on:
  push:
    paths:
      - '.github/workflows/v0601-timer.yml'
      - 'scripts/apply-v0601-timer.mjs'
permissions:
  contents: write
jobs:
  timer-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply timer correction
        run: node scripts/apply-v0601-timer.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.60.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/types.ts src/features/workout/WorkoutExecutionView.tsx tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "fix: start workout timer on first recorded set v0.60.1"
          git push
