name: Finalize TITAN FIT v0.60.2
on:
  push:
    paths:
      - '.github/workflows/v0602-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate
      - name: Trigger signed Android release
        run: |
          printf 'release-v0.60.2-manual-ppl-programming-final\n' > native/android-release.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/android-release.trigger
          git commit -m "build: release validated Android v0.60.2" || true
          git push
