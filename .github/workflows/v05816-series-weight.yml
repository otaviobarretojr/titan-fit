name: "TITAN FIT v0.58.16 Series and Weight"

on:
  push:
    paths:
      - '.github/workflows/v05816-series-weight.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply explicit series plus weight layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/workout/WorkoutExecutionView.tsx')
          s = p.read_text()
          old = """    {exerciseType === 'strength' && numeric('weightKg', 'Peso (kg)', '0.5')}"""
          new = """    {exerciseType === 'strength' && <><div className=\"strength-series-field\"><span>Série</span><strong>{set.setNumber}</strong></div>{numeric('weightKg', 'Peso (kg)', '0.5')}</>}"""
          if old not in s:
            raise SystemExit('strength field marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('src/styles/workout-mobile.css')
          c = css.read_text()
          addon = '''\n/* v0.58.16 — Série + Peso explícitos */\n.strength-series-field{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:58px;padding:10px 14px;border:1px solid rgba(15,23,42,.10);border-radius:14px;background:#f7f9fc;box-sizing:border-box}\n.strength-series-field span{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7b8796}\n.strength-series-field strong{font-size:1.15rem;line-height:1;color:#172033}\n.set-entry-fields.typed-fields:has(.strength-series-field){display:grid;grid-template-columns:minmax(92px,.72fr) minmax(0,1.28fr);gap:10px;align-items:stretch}\n@media(max-width:380px){.set-entry-fields.typed-fields:has(.strength-series-field){grid-template-columns:88px minmax(0,1fr)}}\n'''
          if 'v0.58.16 — Série + Peso explícitos' not in c:
            css.write_text(c + addon)

          test = Path('tests/WorkoutExecutionView.test.tsx')
          t = test.read_text()
          marker = "expect(screen.getByLabelText('Supino máquina série 1 carga')).toBeInTheDocument();"
          if marker in t and "getByText('Série')" not in t:
            t = t.replace(marker, marker + "\n    expect(screen.getAllByText('Série').length).toBeGreaterThan(0);", 1)
          test.write_text(t)
          PY

      - name: Bump version and changelog
        run: |
          npm version 0.58.16 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          marker='Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section='''\n## v0.58.16 — Série + Peso\n- Registro de musculação mostra explicitamente a Série e o Peso em cada linha.\n- REP/Repetições permanece removido do preenchimento manual.\n- Fluxo continua individual por série, com registro de carga e descanso automático.\n'''
          if '## v0.58.16 — Série + Peso' not in s:
            s=s.replace(marker, marker+section)
          p.write_text(s)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate

      - name: Commit v0.58.16
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx src/styles/workout-mobile.css tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "fix: show series and weight explicitly v0.58.16"
          git push
