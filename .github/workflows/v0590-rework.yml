name: "Apply TITAN FIT v0.59.0 rework foundation"
on:
  push:
    paths:
      - '.github/workflows/v0590-rework.yml'
      - 'scripts/apply-v0590-rework.mjs'
      - 'src/styles/rework-foundation-v059.css'
permissions:
  contents: write
jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply rework
        run: node scripts/apply-v0590-rework.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.59.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/programming/ProgrammingPage.tsx src/features/programming/trainingPlanExport.ts src/features/plan/types.ts src/features/plan/validation.ts src/features/workout/WorkoutExecutionView.tsx src/app/App.tsx src/main.tsx src/styles/rework-foundation-v059.css scripts/validate-project.mjs package.json package-lock.json CHANGELOG.md
          git commit -m "refactor: establish video-free rework foundation v0.59.0"
          git push
