name: Apply TITAN FIT v0.58.7 integrated cardio audit fix

on:
  push:
    paths:
      - '.github/workflows/v0587-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply integrated cardio corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/workout/types.ts')
          text = path.read_text()
          text = text.replace('  averageHeartRate: number | null;\n  calories: number | null;\n  notes: string | null;', '  averageHeartRate: number | null;\n  calories: number | null;\n  rpe: number | null;\n  cardioZone: string | null;\n  notes: string | null;')
          path.write_text(text)

          path = Path('src/features/history/types.ts')
          text = path.read_text()
          text = text.replace('  averageHeartRate: number | null;\n  calories: number | null;\n  notes: string | null;', '  averageHeartRate: number | null;\n  calories: number | null;\n  rpe?: number | null;\n  cardioZone?: string | null;\n  notes: string | null;')
          path.write_text(text)

          path = Path('src/features/workout/WorkoutExecutionView.tsx')
          text = path.read_text()
          text = text.replace("type NumericField = 'weightKg' | 'repetitions' | 'rir' | 'durationSeconds' | 'distanceMeters' | 'speedKmh' | 'inclinePercent' | 'averageHeartRate' | 'calories';", "type NumericField = 'weightKg' | 'repetitions' | 'rir' | 'durationSeconds' | 'distanceMeters' | 'speedKmh' | 'inclinePercent' | 'averageHeartRate' | 'calories' | 'rpe';")
          text = text.replace("onText: (field: 'averagePace' | 'notes', value: string) => void;", "onText: (field: 'averagePace' | 'cardioZone' | 'notes', value: string) => void;")
          old = "    {exerciseType === 'cardio' && <>{numeric('durationSeconds', 'Tempo (segundos)')}{numeric('distanceMeters', 'Distância (m)', '1')}{numeric('speedKmh', 'Velocidade (km/h)', '0.1')}{numeric('inclinePercent', 'Inclinação (%)', '0.5')}<label>Ritmo médio<input aria-label={`${exercise.name} ritmo médio`} value={set.averagePace ?? ''} placeholder=\"ex.: 6:30/km\" onChange={(event) => onText('averagePace', event.target.value)} /></label>{numeric('averageHeartRate', 'FC média (bpm)')}{numeric('calories', 'Calorias')}<label>Observações<textarea aria-label={`${exercise.name} observações`} value={set.notes ?? ''} onChange={(event) => onText('notes', event.target.value)} /></label></>}"
          new = "    {exerciseType === 'cardio' && <><label>Duração (min)<input aria-label={`${exercise.name} duração em minutos`} type=\"number\" inputMode=\"decimal\" min=\"0\" step=\"1\" value={set.durationSeconds == null ? '' : Number((set.durationSeconds / 60).toFixed(1))} onChange={(event) => onNumeric(set.setNumber, 'durationSeconds', event.target.value === '' ? '' : String(Number(event.target.value) * 60))} /></label>{numeric('distanceMeters', 'Distância (m)', '1')}{numeric('speedKmh', 'Velocidade (km/h)', '0.1')}{numeric('inclinePercent', 'Inclinação (%)', '0.5')}<label>Ritmo médio<input aria-label={`${exercise.name} ritmo médio`} value={set.averagePace ?? ''} placeholder=\"ex.: 6:30/km\" onChange={(event) => onText('averagePace', event.target.value)} /></label><label>Zona realizada<input aria-label={`${exercise.name} zona realizada`} value={set.cardioZone ?? ''} placeholder={exercise.cardioZone ?? 'ex.: Zona 2'} onChange={(event) => onText('cardioZone', event.target.value)} /></label>{numeric('averageHeartRate', 'FC média (bpm)')}<label>RPE (0–10)<input aria-label={`${exercise.name} RPE`} type=\"number\" inputMode=\"decimal\" min=\"0\" max=\"10\" step=\"1\" value={set.rpe ?? ''} onChange={(event) => onNumeric(set.setNumber, 'rpe', event.target.value)} /></label>{numeric('calories', 'Calorias')}<CardioCalculatedSummary set={set} /><label>Observações<textarea aria-label={`${exercise.name} observações`} value={set.notes ?? ''} onChange={(event) => onText('notes', event.target.value)} /></label></>}"
          if old not in text:
              raise SystemExit('cardio field block not found')
          text = text.replace(old, new)

          marker = "function Prescription({ exercise }: { exercise: TitanExercise }) {"
          helper = '''function CardioCalculatedSummary({ set }: { set: ExecutedSet }) {\n  const durationHours = (set.durationSeconds ?? 0) / 3600;\n  const distanceKm = (set.distanceMeters ?? 0) / 1000;\n  const derivedSpeed = durationHours > 0 && distanceKm > 0 ? distanceKm / durationHours : null;\n  const paceSecondsPerKm = (set.durationSeconds ?? 0) > 0 && distanceKm > 0 ? (set.durationSeconds ?? 0) / distanceKm : null;\n  if (!derivedSpeed && !paceSecondsPerKm) return null;\n  const pace = paceSecondsPerKm ? `${Math.floor(paceSecondsPerKm / 60)}:${String(Math.round(paceSecondsPerKm % 60)).padStart(2, '0')}/km` : '—';\n  return <div className=\"cardio-calculated-summary\"><span>Média calculada</span><strong>{derivedSpeed ? `${derivedSpeed.toFixed(1)} km/h` : '—'} · {pace}</strong></div>;\n}\n\n'''
          if marker not in text:
              raise SystemExit('Prescription marker not found')
          text = text.replace(marker, helper + marker)

          old_blank = "function blankSet(setNumber: number, exercise: TitanExercise): ExecutedSet { return { setNumber, weightKg: null, repetitions: null, rir: resolveExerciseType(exercise) === 'strength' ? exercise.targetRir ?? null : null, durationSeconds: exercise.durationSeconds ?? null, distanceMeters: exercise.distanceMeters ?? exercise.minDistanceMeters ?? null, speedKmh: exercise.speedKmh ?? exercise.speedMinKmh ?? null, inclinePercent: exercise.inclinePercent ?? null, averagePace: exercise.averagePace ?? null, averageHeartRate: exercise.averageHeartRate ?? null, calories: exercise.calories ?? null, notes: exercise.notes ?? null, completed: false }; }"
          new_blank = "function blankSet(setNumber: number, exercise: TitanExercise): ExecutedSet { return { setNumber, weightKg: null, repetitions: null, rir: resolveExerciseType(exercise) === 'strength' ? exercise.targetRir ?? null : null, durationSeconds: exercise.durationSeconds ?? null, distanceMeters: exercise.distanceMeters ?? exercise.minDistanceMeters ?? null, speedKmh: exercise.speedKmh ?? exercise.speedMinKmh ?? null, inclinePercent: exercise.inclinePercent ?? null, averagePace: exercise.averagePace ?? null, averageHeartRate: exercise.averageHeartRate ?? null, calories: exercise.calories ?? null, rpe: null, cardioZone: exercise.cardioZone ?? null, notes: exercise.notes ?? null, completed: false }; }"
          if old_blank not in text:
              raise SystemExit('blankSet marker not found')
          text = text.replace(old_blank, new_blank)
          text = text.replace("calories: 'calorias' })[field];", "calories: 'calorias', rpe: 'RPE' })[field];")
          path.write_text(text)

          test = Path('tests/WorkoutExecutionView.test.tsx')
          content = test.read_text()
          old_test = "    expect(screen.getByRole('button', { name: 'Registrar cardio' })).toBeInTheDocument();\n    expect(screen.queryByText('Pular exercício · sem tempo')).not.toBeInTheDocument();"
          new_test = "    expect(screen.getByRole('button', { name: 'Registrar cardio' })).toBeInTheDocument();\n    expect(screen.getByLabelText('Zona 2 duração em minutos')).toHaveValue(30);\n    expect(screen.getByLabelText('Zona 2 zona realizada')).toHaveValue('Zona 2');\n    expect(screen.getByLabelText('Zona 2 RPE')).toBeInTheDocument();\n    fireEvent.change(screen.getByLabelText('Zona 2 série 1 distância'), { target: { value: '5000' } });\n    expect(screen.getByText(/10.0 km\\/h/)).toBeInTheDocument();\n    expect(screen.queryByText('Pular exercício · sem tempo')).not.toBeInTheDocument();"
          if old_test not in content:
              raise SystemExit('cardio test marker not found')
          content = content.replace(old_test, new_test)
          test.write_text(content)
          PY

      - name: Bump version and changelog
        run: |
          npm version 0.58.7 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = 'Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          section = '''\n## v0.58.7 — Cardio integrado 2.0\n- Cardio permanece exclusivamente como etapa do treino do Projeto TITAN, sem módulo isolado.\n- Entrada de duração passa de segundos para minutos na interface, mantendo segundos internamente para compatibilidade histórica.\n- Registro integrado passa a incluir zona realizada e RPE 0–10, além de distância, velocidade, inclinação, ritmo, FC, calorias e observações.\n- A tela calcula velocidade média e ritmo a partir de duração + distância para conferência rápida do registro.\n- Histórico antigo continua compatível; novos campos são aditivos.\n'''
          if '## v0.58.7 — Cardio integrado 2.0' not in text:
              text = text.replace(marker, marker + section)
          path.write_text(text)
          PY

      - name: Validate locally
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate

      - name: Commit stable v0.58.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx src/features/workout/types.ts src/features/history/types.ts tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "feat: improve integrated cardio v0.58.7"
          git push
