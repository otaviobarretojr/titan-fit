name: "TITAN FIT v0.58.15 Simplify Strength Logging"
on:
  push:
    paths:
      - '.github/workflows/v05815-remove-rir.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply weight-only strength logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/workout/WorkoutExecutionView.tsx')
          s=p.read_text()
          s=s.replace("{exerciseType === 'strength' && <>{numeric('weightKg', 'Carga (kg)', '0.5')}{numeric('repetitions', 'Repetições')}{numeric('rir', 'RIR')}</>}", "{exerciseType === 'strength' && numeric('weightKg', 'Peso (kg)', '0.5')}")
          s=s.replace('Carga, repetições, RIR, histórico, PR e progressão ficam vinculados ao exercício realmente executado.', 'Peso, histórico e evolução ficam vinculados ao exercício realmente executado.')
          s=s.replace("if (exerciseType === 'strength') return set.weightKg !== null && set.weightKg >= 0 && (set.repetitions ?? 0) > 0 && set.rir !== null && set.rir >= 0 && set.rir <= 10;", "if (exerciseType === 'strength') return set.weightKg !== null && set.weightKg >= 0;")
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > src/features/workout/WorkoutExecutionView.rir.test.tsx <<'EOF'
          import { render, screen } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';
          import { WorkoutExecutionView } from './WorkoutExecutionView';
          import type { TitanWorkoutDay } from '../plan/types';
          describe('strength set entry', () => {
            it('asks only for the weight in each strength set', () => {
              const workout: TitanWorkoutDay = { id:'weight-only-test', day:'Segunda', title:'Teste', exercises:[{ id:'bench-test', name:'Supino teste', muscleGroup:'Peito', exerciseType:'strength', sets:1, minReps:8, maxReps:12, restSeconds:60 }] };
              render(<WorkoutExecutionView planId="test-plan" planName="Teste" workout={workout} onBack={() => {}} onCompleted={() => {}} />);
              expect(screen.getByText('Peso (kg)')).toBeInTheDocument();
              expect(screen.queryByText(/^RIR$/i)).not.toBeInTheDocument();
              expect(screen.queryByText('Repetições')).not.toBeInTheDocument();
            });
          });
          EOF
      - name: Bump version
        run: |
          npm version 0.58.15 --no-git-tag-version
          sed -i '1i## v0.58.15\n- Registro de musculação simplificado: cada série pede somente o peso/carga executado. Campos manuais de RIR e repetições foram removidos.\n- A progressão automática fica conservadora quando não houver repetições registradas, sem inventar dados.\n' CHANGELOG.md
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
          npm run validate
      - name: Commit v0.58.15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx src/features/workout/WorkoutExecutionView.rir.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "feat: simplify strength logging to weight only v0.58.15"
          git push
