name: "TITAN FIT v0.58.15 Simplify Strength Logging"

on:
  push:
    paths:
      - '.github/workflows/v05815-remove-rir.yml'
      - 'scripts/apply-v05815.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply migration
        run: python3 scripts/apply-v05815.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run validate
      - name: Commit v0.58.15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutExecutionView.tsx src/features/workout/WorkoutExecutionView.rir.test.tsx tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
          git commit -m "feat: simplify strength logging to weight only v0.58.15"
          git push
