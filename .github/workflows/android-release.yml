name: Release Android TITAN FIT

on:
  push:
    paths:
      - 'native/android-release.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "TITAN-FIT-v${VERSION}-android-test.apk"
          sha256sum "TITAN-FIT-v${VERSION}-android-test.apk" > "TITAN-FIT-v${VERSION}-android-test.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          APK="TITAN-FIT-v${VERSION}-android-test.apk"
          CHECKSUM="${APK}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --title "TITAN FIT v${VERSION} — Android Test" \
              --notes "Primeira entrega Android instalável do TITAN FIT.\n\nInclui Capacitor, ponte nativa Kotlin para Health Connect, leitura de sono, frequência cardíaca, passos, calorias ativas, exercícios, distância e composição corporal, além da tela de justificativa de permissões de saúde.\n\nEste APK é uma versão de teste (debug) destinada à validação no dispositivo Android antes da preparação da assinatura de produção."
          fi
