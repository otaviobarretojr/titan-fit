name: Release Android TITAN FIT

on:
  push:
    paths:
      - 'native/android-release.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TITAN_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TITAN_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'ERRO: assinatura permanente do TITAN FIT não está configurada.'
            echo 'Cadastre TITAN_ANDROID_KEYSTORE_B64 e TITAN_ANDROID_KEYSTORE_PASSWORD nos Actions Secrets.'
            exit 1
          fi

      - name: Restore TITAN signing key
        env:
          KEYSTORE_B64: ${{ secrets.TITAN_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/titan-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/titan-signing/titan-fit-upload.p12"
          chmod 600 "$RUNNER_TEMP/titan-signing/titan-fit-upload.p12"
          echo "TITAN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/titan-signing/titan-fit-upload.p12" >> "$GITHUB_ENV"

      - name: Export signing password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TITAN_ANDROID_KEYSTORE_PASSWORD }}
        run: echo "TITAN_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Sync package metadata
        run: npm version "$(node -p "require('./package.json').version")" --no-git-tag-version --allow-same-version

      - name: Validate project
        run: npm run validate

      - name: Build Android web bundle
        run: npm run build:android

      - name: Guard Android bundle paths
        run: |
          if grep -R "src=\"/titan-fit/\|href=\"/titan-fit/" dist/index.html; then
            echo 'ERRO: bundle Android ainda aponta para /titan-fit/'
            exit 1
          fi
          if [ -f dist/sw.js ]; then
            echo 'ERRO: bundle Android não deve conter Service Worker do PWA.'
            exit 1
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Compile signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "TITAN-FIT-v${VERSION}-android-test.apk"
          sha256sum "TITAN-FIT-v${VERSION}-android-test.apk" > "TITAN-FIT-v${VERSION}-android-test.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-FIT-v${{ env.VERSION }}-android
          path: |
            TITAN-FIT-v${{ env.VERSION }}-android-test.apk
            TITAN-FIT-v${{ env.VERSION }}-android-test.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          APK="TITAN-FIT-v${VERSION}-android-test.apk"
          CHECKSUM="${APK}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --title "TITAN FIT v${VERSION} — Android Test" \
              --notes "Build Android assinado com a chave permanente do TITAN FIT. Atualizações futuras usam a mesma identidade de assinatura para preservar dados locais."
          fi

      - name: Record published release
        run: |
          APK="TITAN-FIT-v${VERSION}-android-test.apk"
          SIZE=$(stat -c%s "$APK")
          SHA=$(cut -d' ' -f1 "${APK}.sha256")
          {
            echo "version=v${VERSION}"
            echo "apk=${APK}"
            echo "size_bytes=${SIZE}"
            echo "sha256=${SHA}"
            echo "published=1"
          } > "docs/android-release-v${VERSION}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/android-release-v${VERSION}.txt"
          git commit -m "chore: record Android v${VERSION} publication" || true
          git push

      - name: Record workflow status
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)
          mkdir -p docs
          {
            echo "version=v${VERSION}"
            echo "job_status=${{ job.status }}"
            echo "commit=${GITHUB_SHA}"
          } > "docs/android-release-status.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-release-status.txt
          git commit -m "chore: record Android release workflow status" || true
          git push || true
