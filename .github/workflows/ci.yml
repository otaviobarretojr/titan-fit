name: Validate TITAN FIT

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v0.60.1 workout timer correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "0.60.1" ]; then
            node scripts/apply-v0601-timer.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/workout/types.ts src/features/workout/WorkoutExecutionView.tsx tests/WorkoutExecutionView.test.tsx package.json package-lock.json CHANGELOG.md
            git commit -m "fix: start workout timer on first recorded set v0.60.1"
            git push
          fi
      - name: Synchronize package-lock metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          NEEDS_SYNC=false
          if [ "$PACKAGE_VERSION" != "$LOCK_VERSION" ]; then
            NEEDS_SYNC=true
          elif ! npm ci --ignore-scripts --dry-run >/dev/null 2>&1; then
            NEEDS_SYNC=true
          fi
          if [ "$NEEDS_SYNC" = true ]; then
            npm install --package-lock-only --ignore-scripts
            if ! git diff --quiet -- package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package-lock.json
              git commit -m "chore: sync package-lock metadata for v${PACKAGE_VERSION}"
              git push
            fi
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate
