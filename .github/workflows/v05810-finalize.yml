name: "Finalize TITAN FIT v0.58.10 Dashboard audit"
on:
  push:
    paths:
      - '.github/workflows/v05810-finalize.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bump version and changelog
        run: |
          npm version 0.58.10 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          marker='Este arquivo registra os cortes de versão oficiais do aplicativo. O histórico detalhado permanece nos commits e nas GitHub Releases.\n'
          entry='''\n## v0.58.10 — Dashboard e programação sincronizados\n- Dashboard detecta sessão ativa salva e troca a ação principal de Iniciar treino para Retomar treino.\n- Sessões em andamento passam a ficar visíveis também na Programação, evitando dúvida sobre o estado atual do treino.\n- Leitura contextual do Coach no Dashboard deixa de contar blocos de cardio como sessões separadas e passa a contar treinos com cardio.\n- Registros cardiovasculares antigos não inflam mais a contagem contextual de musculação.\n- Projeto ativo, treino do dia, sessão persistida e leitura semanal permanecem alinhados na mesma fonte de dados.\n'''
          p.write_text(s.replace(marker, marker+entry, 1))
          PY
      - name: Validate release candidate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run validate
      - name: Commit v0.58.10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: v0.58.10 dashboard synchronization"
          git push
